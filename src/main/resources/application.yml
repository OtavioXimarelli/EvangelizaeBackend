spring:
  application:
    name: evangelizae-api
  data:
    mongodb:
      uri: ${MONGODB_URI}
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    mongo:
      enabled: true

info:
  app:
    name: Evangelizae API
    description: API da liturgia diaria do Evangelizae

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  liturgy:
    import-config:
      token: ${LITURGY_IMPORT_TOKEN}
