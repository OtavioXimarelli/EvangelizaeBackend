spring:
  config:
    activate:
      on-profile: dev
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/evangelizae}
  data:
    mongodb:
      database: ${MONGO_DATABASE:evangelizae}

server:
  forward-headers-strategy: none

app:
  cors:
    # Both spellings of loopback: the frontend's Playwright config uses
    # 127.0.0.1 while `pnpm dev` serves on localhost, and the browser sends
    # whichever origin actually loaded the page. Prod lists exact origins only.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  liturgy:
    import-config:
      token: ${LITURGY_IMPORT_TOKEN:local-import-token-change-me-1234567890}
