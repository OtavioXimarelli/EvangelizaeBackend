services:
  mongodb:
    image: mongo:8.0
    container_name: evangelizae-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: evangelizae
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evangelizae-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MONGODB_URI: ${MONGODB_URI:-mongodb://evangelizae-mongodb:27017/evangelizae}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LITURGY_IMPORT_TOKEN: ${LITURGY_IMPORT_TOKEN}

volumes:
  mongodb_data:
