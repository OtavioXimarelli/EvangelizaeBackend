name: sweep

# The parser gate. `ci` proves the code is self-consistent against fixtures;
# this proves the fixtures still describe what CNBB publishes. A markup change
# at the source breaks ingestion silently - the scraper exits 1, the alert
# fires, and nobody imports a wrong reading - so it has to be checked on a
# cadence, not only on a deploy.
#
# It cannot live in `ci`: it needs network access to CNBB, and it takes minutes
# rather than seconds. A failing run here is a CNBB change, not a bad commit, so
# re-running `ci` will not help.
on:
  schedule:
    # 05:23 UTC, off the :00 spike every scheduled job shares.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First date to sweep (YYYY-MM-DD)"
        required: false
        default: "2026-01-01"
      days:
        description: "Number of consecutive days"
        required: false
        default: "400"

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  parse-sweep:
    name: 400-day parse sweep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: workers/liturgy-scraper
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: workers/liturgy-scraper/pyproject.toml
      - run: uv sync --frozen --dev
      - name: Offline suite still passes
        # A sweep that only runs against the live source cannot tell you the
        # fixtures drifted. Run both.
        run: uv run pytest -q
      - name: Sweep the live source
        run: uv run python tools/sweep.py --start "${{ inputs.start || '2026-01-01' }}" --days "${{ inputs.days || '400' }}"
